name: Bootstrap checks

on:
  workflow_dispatch:
    inputs:
      host_repository:
        description: Repository containing the matching host service contracts
        required: true
        type: string
      host_ref:
        description: Host revision containing the matching service contracts
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tabularis-spatial
    env:
      CARGO_TARGET_DIR: /tmp/tabularis-x0-target/spatial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tabularis-spatial
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.host_repository }}
          ref: ${{ inputs.host_ref }}
          path: tabularis-host
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.30.3
      - name: Prepare host contract package
        working-directory: tabularis-host
        run: |
          pnpm --filter @tabularis/service-contracts install --frozen-lockfile --ignore-scripts
          pnpm --filter @tabularis/service-contracts build
      - name: Install bootstrap dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check the core bootstrap
        run: |
          cargo check --locked
          cargo test --locked
      - name: Build the extension bootstrap
        run: pnpm build:ui
